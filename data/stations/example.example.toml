# A station: one rig, one machine, one TeensyROM board. Copy to <id>.toml (git-ignored).
# Name stations descriptively, e.g. rigA-sys29-trplus.
id = "example"
rig = "rigA"
allow_eeprom_reset = false   # the 'e' letter resets settings; only on a dedicated board
# How the TR meets the expansion port: "direct", or the extender and its slot. Every margin
# record carries it, since an extender moves the bus timing edges; give it before a margin run.
# port_setup = "X-Pander 3, slot 1"

# The machine: a registry id from the validation tracker's systems.csv
# (data/registry.toml names the file), or an inline [machine] table.
# Top-level keys come before the first [table]: TOML puts later keys in that table.
machine_id = "29"
# [machine]
# id = "bench-c64"
# model = "C64"          # C64 | C128 | SX-64 | C64U
# region = "NTSC"        # PAL | NTSC | switchable
# kernal = "stock"

[overrides]              # machine fields the registry does not carry
kernal = "stock"
boot_timeout_s = 60.0
has_kawari = false

[tr]
uid = "00000000"         # the chip id from the version banner ("UID: ...")
# port_hint = "COM91"    # tried first; discovery goes by uid
# tcp_host = "192.0.2.20:2112"

# The C64-USBKeyboard board in this machine, when it has one. Its capabilities come from
# the outputs its own '?' reports fitted: keys, RESTORE and the rest always; tod_select,
# tr_button, tr_alt, ext_reset per output; region_switch with kawari and reset fitted on a
# machine with has_kawari, once kawari_open is set.
# [keyboard]
# chip = "00000000"      # its chip id: the USB serial string is C64USBKeyboard_<chip>
# kawari_open = "NTSC"   # PAL | NTSC: the standard the Kawari gives with its switch header J1 open
# tod = "standard"       # the station's TOD rate: standard (50 Hz on PAL, 60 on NTSC) | 50 | 60 | off

[settings_baseline]      # what the tests expect the board's settings to be
tcp_listener = false
reset_detect = true
autolaunch = "none"
show_extensions = false # Settings' show-extensions option: off hides a typed file's extension on a card

[margins]                # timing floors, per edge: how far up and down a sweep must find the knob clean
# nS_PLAprop = { up = 200, down = 140 }   # up 200: the read margin the item-type fix left on NTSC
                                          # (Constraints.md); floors come from `treadmill margins suggest`
